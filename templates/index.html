<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI FAQ Chatbot</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="chat"><header><h1>AI FAQ Chatbot</h1><p>Ask a question about artificial intelligence.</p></header>
  <section id="messages" aria-live="polite"><div class="bubble bot">Hello! How can I help with AI today?</div></section>
  <form id="form"><input id="message" autocomplete="off" placeholder="Type your question..." autofocus><button>Send</button></form>
  <details><summary>Questions you can try</summary><ul>{% for question in suggestions %}<li><button class="suggestion" type="button">{{ question }}</button></li>{% endfor %}</ul></details>
</main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
